name: Check Harbor
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test
      - run: npm run build
      - id: browser-e2e
        run: npm run test:e2e
        env:
          PLAYWRIGHT_START_SERVER: "1"
      - uses: actions/upload-artifact@v7
        if: failure() && steps.browser-e2e.outcome == 'failure'
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
